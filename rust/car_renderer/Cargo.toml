[package]
name = "car-renderer"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "26", default-features = false, features = ["webgpu", "wgsl"] }
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "=0.4.55"
web-sys = { version = "=0.3.82", features = ["HtmlCanvasElement"] }
bytemuck = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true

[dev-dependencies]
naga = { version = "26", features = ["wgsl-in"] }
