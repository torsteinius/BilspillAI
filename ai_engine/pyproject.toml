[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engine"
version = "0.1.0"
description = "Game-independent dense-network model registry, MLX inference and evolution"
requires-python = ">=3.10"

[project.optional-dependencies]
mlx = ["mlx==0.32.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
